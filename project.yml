name: Nixel
options:
  bundleIdPrefix: com.nilabha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VUWXUY5QX5
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # ---- Home Screen / Lock Screen widget ----
  # Deliberately no App Group: that entitlement needs a paid Apple Developer
  # membership and declaring it on a free personal team breaks device signing.
  # The widget reads volume capacity itself, which any process can do.
  NixelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NixelWidget
      # Shared with the app rather than duplicated, so the ring and the colours
      # stay identical to what the app draws.
      - path: Nixel/Core/Storage/DeviceStorage.swift
      - path: Nixel/DesignSystem/Theme.swift
      - path: Nixel/DesignSystem/AppPalette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nilabha.nixel.widget
        PRODUCT_NAME: NixelWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: NixelWidget/Info.plist
      properties:
        CFBundleDisplayName: Nixel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Nixel:
    type: application
    platform: iOS
    sources:
      - path: Nixel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nilabha.nixel
        PRODUCT_NAME: Nixel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Mocha AppIcon-Buttermilk AppIcon-Blush AppIcon-Twinkle"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: NixelWidget
        embed: true
    info:
      path: Nixel/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nixel
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # --- Privacy. TCC terminates the app on a permission request with no matching
        # --- string here, so these are load-bearing, not boilerplate.
        NSPhotoLibraryUsageDescription: >-
          Nixel scans the photos and videos on this device to find duplicates,
          near-identical shots, screenshots and large videos so you can free up space.
          Your photos are never uploaded or shared — everything happens on your iPhone.
        NSContactsUsageDescription: >-
          Nixel looks through your contacts to find duplicate entries you can merge or
          remove. Your contacts stay on this device and are never uploaded or shared.
        # We present the "select more photos" picker ourselves, at a moment that makes
        # sense, instead of letting iOS surface it at random on every launch.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
        # The daily agent runs as a processing task while the phone is idle and on power.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.nilabha.nixel.dailyscan
